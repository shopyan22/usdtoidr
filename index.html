<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD to IDR Converter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0f12;
            background-image: 
                radial-gradient(at 20% 20%, rgba(38, 161, 123, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(14, 122, 96, 0.12) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f1f5f9;
        }

        .converter-container {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                        0 0 20px rgba(38, 161, 123, 0.1);
            padding: 32px 24px;
            text-align: center;
            width: 100%;
            max-width: 440px;
            margin: 16px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #26A17B 0%, #50E3C2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        gecko-coin-converter-widget {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="converter-container">
        <h1>USD to IDR Converter</h1>
        <script src="https://widgets.coingecko.com/gecko-coin-converter-widget.js"></script>
        <gecko-coin-converter-widget locale="en" dark-mode="true" transparent-background="true" coin-id="tether" initial-currency="idr"></gecko-coin-converter-widget>
    </div>

</body>
</html>
